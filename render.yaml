# Render Blueprint for ARMYVERSE — free-tier single web service.
#
# The FastAPI backend serves both the /api routes and the built React SPA
# (frontend/dist) on the same origin, mirroring the local dev proxy layout.
# Media files are stored in Cloudflare R2 (public bucket) so uploads survive
# restarts and redeploys without any paid disk.
services:
  - type: web
    name: armyverse
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      cd ../frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: FRONTEND_URL
        sync: false
      - key: ASTRA_DB_API_ENDPOINT
        sync: false
      - key: ASTRA_DB_APPLICATION_TOKEN
        sync: false
      - key: ASTRA_DB_KEYSPACE
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ARMYVERSE_DATA_FILE
        sync: false